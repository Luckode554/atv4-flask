
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block titulo %}Rascunho — um blog de estudos{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Fontes -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/custom.css') }}">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-md sticky-top custom-navbar">
            <div class="container">

                <a class="navbar-brand"
                   href="{{ url_for('index') }}">
                    Rascunho
                </a>

                <!-- Menu responsivo para telas pequenas. -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navMenu"
                        aria-controls="navMenu"
                        aria-expanded="false"
                        aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link"
                               href="{{ url_for('index') }}">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="{{ url_for('sobre') }}">
                                Sobre
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="{{ url_for('contato') }}">
                                Enviar comentário
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="{{ url_for('listar') }}">
                                Comentários
                            </a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Conteúdo das páginas que herdam base.html. -->
    <main class="container py-5">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="site-footer text-center py-4">
        <div class="container">
            <p class="mb-0 text-muted small">
                Lucas Eduardo Rodrigues de Almeida -
                Atividade 4 - Desenvolvimento Web
            </p>
        </div>
    </footer>

    <!-- JavaScript do Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
